  <polygon points="483,391 472,385.5 472,396.5" fill="#23637e"/>

  <text x="447" y="377" font-size="16" font-weight="400" fill="#23637e" text-anchor="middle">log</text>

  <path d="M832 391L909 391" fill="none" stroke="#66457d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="909,391 898,385.5 898,396.5" fill="#66457d"/>

  <text x="872" y="377" font-size="16" font-weight="400" fill="#66457d" text-anchor="middle">review</text>

  <path d="M1118 488L1118 512" fill="none" stroke="#66457d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="1118,512 1123.5,501 1112.5,501" fill="#66457d"/>

  <rect x="486" y="517" width="840" height="67" rx="8" fill="#152d40" stroke="none" stroke-width="1.2"/>

  <text x="509" y="544" font-size="16" font-weight="700" fill="#dbe9eb" letter-spacing="1.1">PAIRED REPLAY</text>

  <text x="509" y="570" font-size="18" font-weight="400" fill="#f0f6f7">Active vs candidate · same cases · independent state copies</text>

  <path d="M486 552L243 552L243 491" fill="none" stroke="#1e664f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <polygon points="243,491 237.5,502 248.5,502" fill="#1e664f"/>

  <text x="365" y="530" font-size="17" font-weight="400" fill="#1e664f" text-anchor="middle">activate after review</text>

  <text x="318" y="606" font-size="16" font-weight="400" fill="#1e664f" text-anchor="middle">Activation stamps the next run with its version.</text>

  <text x="1302" y="615" font-size="17" font-weight="400" fill="#536576" text-anchor="end">Record results and the release decision</text>

  <rect x="48" y="674" width="1304" height="128" rx="12" fill="#152d40" stroke="#152d40" stroke-width="1.2"/>

  <text x="73" y="711" font-size="16" font-weight="700" fill="#dbe9eb" letter-spacing="1.1">SOVA-KIT-DATA  /  SIBLING TO THE CHECKOUT</text>

  <line x1="471" y1="728" x2="471" y2="779" stroke="#527183" stroke-width="1"/>

  <line x1="888" y1="728" x2="888" y2="779" stroke="#527183" stroke-width="1"/>

  <text x="73" y="746" font-size="21" font-weight="700" fill="#ffffff">traces/</text>

  <text x="73" y="776" font-size="17" font-weight="400" fill="#dbe9eb">Source evidence and audits</text>

  <text x="496" y="746" font-size="21" font-weight="700" fill="#ffffff">workspace/</text>

  <text x="496" y="776" font-size="17" font-weight="400" fill="#dbe9eb">Local jobs and improvement rounds</text>

  <text x="915" y="746" font-size="21" font-weight="700" fill="#ffffff">runs/sagemaker/</text>

  <text x="915" y="776" font-size="17" font-weight="400" fill="#dbe9eb">Per-job inputs and launch metadata</text>

  <rect x="48" y="832" width="634" height="168" rx="12" fill="#faf0dd" stroke="#d9bc86" stroke-width="1.2"/>
  <rect x="49" y="845" width="4" height="142" rx="2" fill="#7f521a" stroke="none" stroke-width="1.2"/>

  <text x="73" y="866" font-size="16" font-weight="700" fill="#7f521a" letter-spacing="1.1">VIDEO HARNESS  /  PRODUCT FILMS</text>

  <text x="73" y="902" font-size="24" font-weight="700" fill="#182b3c">From a brief to an editable cut</text>

  <text x="73" y="938" font-size="19" font-weight="400" fill="#182b3c">Reviewed captures → film.json + React</text>
  <text x="73" y="965" font-size="19" font-weight="400" fill="#182b3c">Same timeline → Studio preview or MP4</text>

  <rect x="712" y="832" width="640" height="168" rx="12" fill="#e9f4eb" stroke="#a6c7ad" stroke-width="1.2"/>
  <rect x="713" y="845" width="4" height="142" rx="2" fill="#1e664f" stroke="none" stroke-width="1.2"/>

  <text x="737" y="866" font-size="16" font-weight="700" fill="#1e664f" letter-spacing="1.1">CACHE HANDOFF  /  MODEL RUNTIME</text>

  <text x="737" y="902" font-size="24" font-weight="700" fill="#182b3c">Reuse an identical prefix</text>

  <text x="737" y="938" font-size="19" font-weight="400" fill="#182b3c">Scoped native KV → private worker copy</text>
  <text x="737" y="965" font-size="19" font-weight="400" fill="#182b3c">Engine processes the uncached tokens</text>
</svg>
