<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1046" viewBox="0 0 1400 1046" font-family="Menlo, Consolas, monospace" role="img" aria-labelledby="kit-map-title kit-map-desc">
  <title id="kit-map-title">Sova-Kit</title>
  <desc id="kit-map-desc">The execution log is captured by SwitchIt. Reviewed evidence and pinned cases enter SwitchUp, where the active and candidate recipes use independent copies of the same state. A verified instruction revision can activate for future requests and its generation is recorded on later traces. The data folder is a sibling of the checkout. Video Harness and Cache Handoff have their own inputs and outputs.</desc>
  <defs>
    <pattern id="kit-map-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#e3e7e6" stroke-width=".75"/>
    </pattern>
  </defs>
  <rect width="1400" height="1046" fill="#f7f7f3"/>
  <rect width="1400" height="1046" fill="url(#kit-map-grid)"/>
  <rect width="1400" height="8" fill="#152d40"/>
  <text x="48" y="49" font-size="16" font-weight="700" fill="#23637e" letter-spacing="1.1">SOVA-KIT  /  ARCHITECTURE</text>
  <text x="1352" y="49" font-size="16" font-weight="700" fill="#536576" text-anchor="end" letter-spacing="1.1">TRACE EVIDENCE  ·  PAIRED REPLAY</text>
  <text x="48" y="108" font-size="43" font-weight="700" fill="#182b3c" letter-spacing="-1.3">Sova-Kit</text>
  <text x="50" y="147" font-size="21" font-weight="400" fill="#536576">From recorded agent work to a change you can verify and ship.</text>
  <line x1="48" y1="177" x2="1352" y2="177" stroke="#b5c4cb" stroke-width="1"/>
  <rect x="48" y="205" width="1304" height="446" rx="12" fill="#ffffff" stroke="#b5c4cb" stroke-width="1.2"/>

  <text x="74" y="242" font-size="16" font-weight="700" fill="#536576" letter-spacing="1.1">TRACE-TO-UPDATE PATH</text>

  <text x="1326" y="242" font-size="16" font-weight="700" fill="#23637e" text-anchor="end" letter-spacing="1.1">RECORDED RUNS  →  REVIEWED DECISIONS</text>

  <rect x="74" y="278" width="332" height="210" rx="12" fill="#edf1f4" stroke="#c0cdd3" stroke-width="1.2"/>
  <rect x="75" y="291" width="4" height="184" rx="2" fill="#3c566a" stroke="none" stroke-width="1.2"/>

  <text x="95" y="312" font-size="16" font-weight="700" fill="#3c566a" letter-spacing="1.1">CONNECTED WORKFLOW</text>

  <text x="95" y="350" font-size="27" font-weight="700" fill="#182b3c">Agent execution</text>

  <text x="95" y="387" font-size="20" font-weight="400" fill="#182b3c">Request and model turns</text>
  <text x="95" y="414" font-size="20" font-weight="400" fill="#182b3c">Tool calls and receipts</text>
  <text x="95" y="441" font-size="20" font-weight="400" fill="#182b3c">Observed outcome</text>

  <text x="95" y="470" font-size="17" font-weight="700" fill="#3c566a">recipe_id + generation</text>

  <rect x="486" y="278" width="346" height="210" rx="12" fill="#e8f3f6" stroke="#a9cbd5" stroke-width="1.2"/>
  <rect x="487" y="291" width="4" height="184" rx="2" fill="#23637e" stroke="none" stroke-width="1.2"/>

  <text x="509" y="312" font-size="16" font-weight="700" fill="#23637e" letter-spacing="1.1">SWITCHIT</text>

  <text x="509" y="350" font-size="27" font-weight="700" fill="#182b3c">Trace evidence</text>

  <text x="509" y="387" font-size="20" font-weight="400" fill="#182b3c">Link events by identity.</text>
  <text x="509" y="414" font-size="20" font-weight="400" fill="#182b3c">Join calls to final state.</text>
  <text x="509" y="441" font-size="20" font-weight="400" fill="#182b3c">Mark inferred links.</text>

  <text x="509" y="470" font-size="17" font-weight="700" fill="#23637e">trace_id / event_id / source</text>

  <rect x="912" y="278" width="414" height="210" rx="12" fill="#f2edf7" stroke="#cbbada" stroke-width="1.2"/>
  <rect x="913" y="291" width="4" height="184" rx="2" fill="#66457d" stroke="none" stroke-width="1.2"/>

  <text x="936" y="312" font-size="16" font-weight="700" fill="#66457d" letter-spacing="1.1">SWITCHUP</text>

  <text x="936" y="350" font-size="27" font-weight="700" fill="#182b3c">One proposed change</text>

  <text x="936" y="387" font-size="20" font-weight="400" fill="#182b3c">Review a correction.</text>
  <text x="936" y="414" font-size="20" font-weight="400" fill="#182b3c">Pin cases and checks.</text>
  <text x="936" y="441" font-size="20" font-weight="400" fill="#182b3c">Dream → instruction revision</text>

  <text x="936" y="470" font-size="17" font-weight="700" fill="#7f521a">LoRA Route → adapter pilot</text>

