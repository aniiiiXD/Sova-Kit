<path d="M1055 409H1090V356" fill="none" stroke="#7a88a0" stroke-width="1.6" stroke-linejoin="round"/>
<path d="M876 371V342" fill="none" stroke="#a26c24" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#retry)"/>
<text x="894" y="361" class="edge" text-anchor="start" style="fill:#865417">invalid or late → native</text>
<text x="506" y="414" class="edge" text-anchor="start">no escalation</text>
<rect x="87" y="305" width="217" height="76" rx="8" fill="#eaf5fc" stroke="#a8cfe9"/>
<text x="195.5" y="340.0" class="node" text-anchor="middle" style="fill:#146187">1.7B worker</text>
<text x="195.5" y="359.0" class="detail" text-anchor="middle">Read evidence and answer</text>
<rect x="368" y="305" width="240" height="76" rx="8" fill="#f3edfa" stroke="#c9b6e2"/>
<text x="488.0" y="340.0" class="node" text-anchor="middle" style="fill:#68438c">Escalation router</text>
<text x="488.0" y="359.0" class="detail" text-anchor="middle">Check cache identity</text>
<rect x="368" y="435" width="240" height="52" rx="8" fill="#f7f8fa" stroke="#ced3dc"/>
<text x="488.0" y="467.0" class="node" text-anchor="middle" style="fill:#485469">Return worker answer</text>
<rect x="701" y="272" width="354" height="70" rx="8" fill="#eaf5fc" stroke="#a8cfe9"/>
<text x="878.0" y="304.0" class="node" text-anchor="middle" style="fill:#146187">Native 8B path</text>
<text x="878.0" y="323.0" class="detail" text-anchor="middle">Reuse longest prefix, read remainder</text>
<rect x="701" y="371" width="354" height="76" rx="8" fill="#f3edfa" stroke="#c9b6e2"/>
<text x="878.0" y="406.0" class="node" text-anchor="middle" style="fill:#68438c">Transfer when eligible</text>
<text x="878.0" y="425.0" class="detail" text-anchor="middle">Convert exact source prefix and validate</text>
<rect x="1128" y="306" width="284" height="100" rx="8" fill="#e7f5eb" stroke="#9bceaa"/>
<text x="1270.0" y="344.0" class="node" text-anchor="middle" style="fill:#23623a">8B orchestrator</text>
<text x="1270.0" y="363.0" class="detail" text-anchor="middle">Read private review suffix</text>
<text x="1270.0" y="380.0" class="detail" text-anchor="middle">Return answer and trace</text>
<path d="M87 507H1412" fill="none" stroke="#7a88a0" stroke-width="1.6" stroke-linejoin="round"/>
<text x="87" y="531" class="note" text-anchor="start">Shared prefix stays immutable. Each agent owns the suffix it appends.</text>
<rect x="56" y="576" width="1388" height="897" rx="15" fill="#ffffff" stroke="#d1d7e1"/>
<text x="87" y="615" class="tag" text-anchor="start" style="fill:#68438c">02</text>
<text x="128" y="617" class="section" text-anchor="start">Engineering · async build and review</text>
<text x="1412" y="615" class="tag" text-anchor="end" style="fill:#68438c">[ DURABLE CONTROLLER ]</text>
