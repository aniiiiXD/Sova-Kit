<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1530" viewBox="0 0 1500 1530" role="img" aria-labelledby="title description">
<title id="title">SOVA cache handoff and async build graph</title>
<desc id="description">A small worker escalates to a larger model by reusing a native prefix or translating a compatible source cache. In the engineering loop, modules join at native verification, a candidate is profiled and trained, Astra reviews the results, and independent confirmation is required for success.</desc>
<defs>
  <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#e5e8ee" stroke-width="1"/></pattern>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7.2" refY="3.8" orient="auto"><path d="M0 0L8 3.8L0 7.6z" fill="#62718a"/></marker>
  <marker id="retry" markerWidth="8" markerHeight="8" refX="7.2" refY="3.8" orient="auto"><path d="M0 0L8 3.8L0 7.6z" fill="#a26c24"/></marker>
  <marker id="failure" markerWidth="8" markerHeight="8" refX="7.2" refY="3.8" orient="auto"><path d="M0 0L8 3.8L0 7.6z" fill="#a8574c"/></marker>
  <style>
    text {font-family: "SF Mono", Menlo, Consolas, monospace; fill: #182435;}
    .headline {font-size: 42px; font-weight: 700; letter-spacing: -1.7px;}
    .sub {font-size: 17px; fill: #52627a;}
    .tag {font-size: 13px; font-weight: 700; letter-spacing: 1.7px;}
    .section {font-size: 24px; font-weight: 700; letter-spacing: -.55px;}
    .node {font-size: 17px; font-weight: 700;}
    .detail {font-size: 13px; fill: #4d5b70;}
    .note {font-size: 13px; fill: #4d5b70;}
    .edge {font-size: 12px; fill: #4d5b70;}
  </style>
</defs>
<rect width="1500" height="1530" fill="#fafafa"/>
<rect width="1500" height="1530" fill="url(#grid)"/>
<text x="65" y="57" class="tag" text-anchor="start" style="fill:#146187">[ SOVA / SYSTEM DESIGN ]</text>
<text x="65" y="113" class="headline" text-anchor="start">Cross-model cache handoff</text>
<text x="67" y="149" class="sub" text-anchor="start">How agents share evidence at runtime, and how we build and verify the system.</text>
<rect x="56" y="185" width="1388" height="366" rx="15" fill="#ffffff" stroke="#d1d7e1"/>
<text x="87" y="224" class="tag" text-anchor="start" style="fill:#146187">01</text>
<text x="128" y="226" class="section" text-anchor="start">Runtime · one escalation</text>
<path d="M304 343H368" fill="none" stroke="#7a88a0" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M608 343H655V307H701" fill="none" stroke="#7a88a0" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
