<text x="624" y="1145" class="edge" text-anchor="start" style="fill:#23623a">development gates pass</text>
<text x="624" y="1338" class="edge" text-anchor="start" style="fill:#23623a">all final gates pass</text>
<rect x="84" y="649" width="944" height="55" rx="8" fill="#f7f8fa" stroke="#ced3dc"/>
<text x="556.0" y="682.5" class="node" text-anchor="middle" style="fill:#485469">Freeze goal, thresholds and budget</text>
<rect x="84" y="747" width="290" height="75" rx="8" fill="#eaf5fc" stroke="#a8cfe9"/>
<text x="229.0" y="781.5" class="node" text-anchor="middle" style="fill:#146187">Cache contract</text>
<text x="229.0" y="800.5" class="detail" text-anchor="middle">Exact prefix, keys, isolation</text>
<rect x="411" y="747" width="290" height="75" rx="8" fill="#eaf5fc" stroke="#a8cfe9"/>
<text x="556.0" y="781.5" class="node" text-anchor="middle" style="fill:#146187">Replay protocol</text>
<text x="556.0" y="800.5" class="detail" text-anchor="middle">Trace, scorer, grouped splits</text>
<rect x="738" y="747" width="290" height="75" rx="8" fill="#eaf5fc" stroke="#a8cfe9"/>
<text x="883.0" y="781.5" class="node" text-anchor="middle" style="fill:#146187">Async controller</text>
<text x="883.0" y="800.5" class="detail" text-anchor="middle">Leases and atomic GPU budget</text>
<rect x="84" y="863" width="944" height="62" rx="8" fill="#eaf5fc" stroke="#a8cfe9"/>
<text x="556.0" y="891.0" class="node" text-anchor="middle" style="fill:#146187">Join tested modules · verify native cache reuse</text>
<text x="556.0" y="910.0" class="detail" text-anchor="middle">Registry + receiver + replay harness · Astra reviews native controls</text>
<rect x="84" y="958" width="476" height="64" rx="8" fill="#f3edfa" stroke="#c9b6e2"/>
<text x="322.0" y="987.0" class="node" text-anchor="middle" style="fill:#68438c">Profile conversion</text>
<text x="322.0" y="1006.0" class="detail" text-anchor="middle">Estimate break-even against native prefill</text>
<rect x="586" y="958" width="442" height="64" rx="8" fill="#f3edfa" stroke="#c9b6e2"/>
<text x="807.0" y="987.0" class="node" text-anchor="middle" style="fill:#68438c">Fit one candidate</text>
<text x="807.0" y="1006.0" class="detail" text-anchor="middle">Train adapter on separate documents</text>
<rect x="84" y="1060" width="944" height="66" rx="8" fill="#f3edfa" stroke="#c9b6e2"/>
<text x="556.0" y="1090.0" class="node" text-anchor="middle" style="fill:#68438c">Test candidate · Astra reviews development results</text>
<text x="556.0" y="1109.0" class="detail" text-anchor="middle">Score direct transfer and the full policy with fallback</text>
<rect x="1094" y="1036" width="326" height="75" rx="8" fill="#fff4e2" stroke="#e5c08b"/>
<text x="1257.0" y="1061.5" class="node" text-anchor="middle" style="fill:#865417">Fix and retry</text>
<text x="1257.0" y="1080.5" class="detail" text-anchor="middle">Controller reruns only</text>
<text x="1257.0" y="1097.5" class="detail" text-anchor="middle">affected nodes</text>
<rect x="84" y="1152" width="944" height="64" rx="8" fill="#f3edfa" stroke="#c9b6e2"/>
<text x="556.0" y="1181.0" class="node" text-anchor="middle" style="fill:#68438c">Freeze candidate and run held-out confirmation</text>
<text x="556.0" y="1200.0" class="detail" text-anchor="middle">Independent evaluator owns first access to the locked set</text>
<rect x="84" y="1242" width="944" height="64" rx="8" fill="#f3edfa" stroke="#c9b6e2"/>
<text x="556.0" y="1271.0" class="node" text-anchor="middle" style="fill:#68438c">Verify raw evidence · Astra reviews final verdict</text>
<text x="556.0" y="1290.0" class="detail" text-anchor="middle">Quality, coverage, latency and cost must all pass</text>
<rect x="1094" y="1239" width="326" height="75" rx="8" fill="#fbefed" stroke="#e4b5ad"/>
<text x="1257.0" y="1264.5" class="node" text-anchor="middle" style="fill:#91443a">Record non-success</text>
<text x="1257.0" y="1283.5" class="detail" text-anchor="middle">Blocked, inconclusive, rejected</text>
<text x="1257.0" y="1300.5" class="detail" text-anchor="middle">or budget exhausted</text>
<rect x="84" y="1350" width="944" height="60" rx="8" fill="#e7f5eb" stroke="#9bceaa"/>
<text x="556.0" y="1386.0" class="node" text-anchor="middle" style="fill:#23623a">Goal achieved</text>
<text x="87" y="1448" class="note" text-anchor="start">A passing module unlocks its dependents. Only independent confirmation can mark the goal achieved.</text>
