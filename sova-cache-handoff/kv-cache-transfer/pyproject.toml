[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sova-kvverify"
version = "0.1.0"
description = "Controlled cross-model KV transfer experiments and evidence validation"
readme = "HANDOFF.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
hf = ["torch>=2.6,<3", "transformers==4.52.4", "safetensors>=0.4,<1"]
vllm = ["vllm==0.34.0", "safetensors>=0.4,<1"]

[project.scripts]
kvverify = "kvverify.cli:main"

[tool.setuptools.packages.find]
include = ["kvverify*"]
