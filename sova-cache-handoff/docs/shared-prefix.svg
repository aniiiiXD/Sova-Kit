<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1044" viewBox="0 0 1400 1044" font-family="Menlo, Consolas, monospace" role="img" aria-labelledby="native-prefix-title native-prefix-desc">
  <title id="native-prefix-title">One shared prefix, two private continuations</title>
  <desc id="native-prefix-desc">The fixture's shared prefix is 53 byte tokens. Worker A appends 23 tokens and worker B appends 30. Cold A processes 76 tokens. A partial hit reuses 20 and processes 56. Full hits reuse 53 and process the worker's suffix. The registry matches tenant, model, tokenizer, cache layout, and exact leading token IDs, and clones the cache for each request.</desc>
  <defs>
    <pattern id="native-prefix-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#e3e7e6" stroke-width=".75"/>
    </pattern>
  </defs>
  <rect width="1400" height="1044" fill="#f7f7f3"/>
  <rect width="1400" height="1044" fill="url(#native-prefix-grid)"/>
  <rect width="1400" height="8" fill="#152d40"/>
  <text x="48" y="49" font-size="16" font-weight="700" fill="#23637e" letter-spacing="1.1">SOVA-KIT  /  CACHE HANDOFF</text>
  <text x="1352" y="49" font-size="16" font-weight="700" fill="#536576" text-anchor="end" letter-spacing="1.1">SAME-MODEL  ·  IN-PROCESS</text>
  <text x="48" y="108" font-size="43" font-weight="700" fill="#182b3c" letter-spacing="-1.3">One shared prefix, two private continuations</text>
  <text x="50" y="147" font-size="21" font-weight="400" fill="#536576">Cache Handoff chooses the longest matching native prefix and clones its state.</text>
  <line x1="48" y1="177" x2="1352" y2="177" stroke="#b5c4cb" stroke-width="1"/>
  <rect x="48" y="205" width="1304" height="142" rx="12" fill="#e9f4eb" stroke="#a6c7ad" stroke-width="1.2"/>
  <rect x="49" y="218" width="4" height="116" rx="2" fill="#1e664f" stroke="none" stroke-width="1.2"/>

  <text x="73" y="239" font-size="16" font-weight="700" fill="#1e664f" letter-spacing="1.1">REGISTRY KEY  /  EXACT SCOPE MATCH</text>

  <text x="73" y="278" font-size="16" font-weight="700" fill="#1e664f" letter-spacing="1.1">TENANT</text>
  <text x="73" y="313" font-size="22" font-weight="700" fill="#182b3c">team-a</text>

  <text x="372" y="278" font-size="16" font-weight="700" fill="#1e664f" letter-spacing="1.1">MODEL</text>
  <text x="372" y="313" font-size="22" font-weight="700" fill="#182b3c">fixture-v1</text>

  <text x="678" y="278" font-size="16" font-weight="700" fill="#1e664f" letter-spacing="1.1">TOKENIZER</text>
  <text x="678" y="313" font-size="22" font-weight="700" fill="#182b3c">byte-tokenizer-v1</text>

  <text x="1010" y="278" font-size="16" font-weight="700" fill="#1e664f" letter-spacing="1.1">KV LAYOUT</text>
  <text x="1010" y="313" font-size="22" font-weight="700" fill="#182b3c">fixture-cache-v1</text>

  <line x1="346" y1="260" x2="346" y2="321" stroke="#a6c7ad" stroke-width="1"/>

  <line x1="652" y1="260" x2="652" y2="321" stroke="#a6c7ad" stroke-width="1"/>

  <line x1="983" y1="260" x2="983" y2="321" stroke="#a6c7ad" stroke-width="1"/>

  <rect x="48" y="377" width="1304" height="422" rx="12" fill="#ffffff" stroke="#b5c4cb" stroke-width="1.2"/>

  <text x="73" y="413" font-size="16" font-weight="700" fill="#1e664f" letter-spacing="1.1">SYNTHETIC BYTE-TOKEN FIXTURE</text>

  <text x="73" y="448" font-size="26" font-weight="700" fill="#182b3c">Which tokens reach the engine</text>

  <rect x="73" y="470" width="22" height="16" rx="3" fill="#e9f4eb" stroke="#a6c7ad" stroke-width="1.2"/>
  <text x="105" y="485" font-size="17" font-weight="400" fill="#536576">Reused native state</text>

  <rect x="408" y="470" width="22" height="16" rx="3" fill="#e8f3f6" stroke="#a9cbd5" stroke-width="1.2"/>
  <text x="440" y="485" font-size="17" font-weight="400" fill="#536576">Shared tokens to process</text>

  <rect x="813" y="470" width="22" height="16" rx="3" fill="#f2edf7" stroke="#cbbada" stroke-width="1.2"/>
  <text x="845" y="485" font-size="17" font-weight="400" fill="#536576">Worker suffix</text>

  <line x1="73" y1="504" x2="1326" y2="504" stroke="#b5c4cb" stroke-width="1"/>

  <text x="1324" y="525" font-size="16" font-weight="700" fill="#536576" text-anchor="end" letter-spacing="1.1">REUSE / PROCESS</text>

  <text x="73" y="554" font-size="20" font-weight="700" fill="#182b3c">Cold A</text>
  <text x="73" y="575" font-size="15" font-weight="400" fill="#536576">No entry</text>
  <rect x="284" y="537" width="522.05" height="37" rx="4" fill="#e8f3f6" stroke="#a9cbd5" stroke-width="1.2"/>
  <text x="545.02" y="562" font-size="17" font-weight="700" fill="#23637e" text-anchor="middle">53 shared</text>
  <rect x="806.05" y="537" width="226.55" height="37" rx="4" fill="#f2edf7" stroke="#cbbada" stroke-width="1.2"/>
  <text x="919.32" y="562" font-size="17" font-weight="700" fill="#66457d" text-anchor="middle">23 private</text>
  <text x="1324" y="562" font-size="21" font-weight="700" fill="#3c566a" text-anchor="end">0 / 76</text>

  <text x="73" y="613" font-size="20" font-weight="700" fill="#182b3c">Partial A</text>
  <text x="73" y="634" font-size="15" font-weight="400" fill="#536576">First 20 cached</text>
  <rect x="284" y="596" width="197" height="37" rx="4" fill="#e9f4eb" stroke="#a6c7ad" stroke-width="1.2"/>
  <text x="382.5" y="621" font-size="17" font-weight="700" fill="#1e664f" text-anchor="middle">20 cache</text>
  <rect x="481" y="596" width="325.05" height="37" rx="4" fill="#e8f3f6" stroke="#a9cbd5" stroke-width="1.2"/>
  <text x="643.52" y="621" font-size="17" font-weight="700" fill="#23637e" text-anchor="middle">33 shared</text>
  <rect x="806.05" y="596" width="226.55" height="37" rx="4" fill="#f2edf7" stroke="#cbbada" stroke-width="1.2"/>
  <text x="919.32" y="621" font-size="17" font-weight="700" fill="#66457d" text-anchor="middle">23 private</text>
  <text x="1324" y="621" font-size="21" font-weight="700" fill="#3c566a" text-anchor="end">20 / 56</text>

  <text x="73" y="672" font-size="20" font-weight="700" fill="#182b3c">Warm A</text>
  <text x="73" y="693" font-size="15" font-weight="400" fill="#536576">Full prefix</text>
  <rect x="284" y="655" width="522.05" height="37" rx="4" fill="#e9f4eb" stroke="#a6c7ad" stroke-width="1.2"/>
  <text x="545.02" y="680" font-size="17" font-weight="700" fill="#1e664f" text-anchor="middle">53 cache</text>
  <rect x="806.05" y="655" width="226.55" height="37" rx="4" fill="#f2edf7" stroke="#cbbada" stroke-width="1.2"/>
  <text x="919.32" y="680" font-size="17" font-weight="700" fill="#66457d" text-anchor="middle">23 private</text>
  <text x="1324" y="680" font-size="21" font-weight="700" fill="#3c566a" text-anchor="end">53 / 23</text>

  <text x="73" y="731" font-size="20" font-weight="700" fill="#182b3c">Warm B</text>
  <text x="73" y="752" font-size="15" font-weight="400" fill="#536576">New suffix</text>
  <rect x="284" y="714" width="522.05" height="37" rx="4" fill="#e9f4eb" stroke="#a6c7ad" stroke-width="1.2"/>
  <text x="545.02" y="739" font-size="17" font-weight="700" fill="#1e664f" text-anchor="middle">53 cache</text>
  <rect x="806.05" y="714" width="295.5" height="37" rx="4" fill="#f2edf7" stroke="#cbbada" stroke-width="1.2"/>
  <text x="953.8" y="739" font-size="17" font-weight="700" fill="#66457d" text-anchor="middle">30 private</text>
  <text x="1324" y="739" font-size="21" font-weight="700" fill="#3c566a" text-anchor="end">53 / 30</text>

  <text x="73" y="782" font-size="17" font-weight="400" fill="#536576">The fixture checks that cold, partial, and warm runs of A yield the same output.</text>

  <rect x="48" y="828" width="634" height="170" rx="12" fill="#e9f4eb" stroke="#a6c7ad" stroke-width="1.2"/>
  <rect x="49" y="841" width="4" height="144" rx="2" fill="#1e664f" stroke="none" stroke-width="1.2"/>

  <text x="73" y="864" font-size="16" font-weight="700" fill="#1e664f" letter-spacing="1.1">NATIVE PREFIX REGISTRY</text>

  <text x="73" y="899" font-size="22" font-weight="700" fill="#182b3c">longest_native(scope, prefix)</text>

  <text x="73" y="933" font-size="18" font-weight="400" fill="#182b3c">Match exact leading tokens and scope.</text>
  <text x="73" y="960" font-size="18" font-weight="400" fill="#182b3c">Enforce retention time and byte limit.</text>

  <rect x="712" y="828" width="640" height="170" rx="12" fill="#e8f3f6" stroke="#a9cbd5" stroke-width="1.2"/>
  <rect x="713" y="841" width="4" height="144" rx="2" fill="#23637e" stroke="none" stroke-width="1.2"/>

  <text x="737" y="864" font-size="16" font-weight="700" fill="#23637e" letter-spacing="1.1">MODEL ENGINE ADAPTER</text>

  <text x="737" y="899" font-size="21" font-weight="700" fill="#182b3c">advance(scope, remaining, copy)</text>

  <text x="737" y="933" font-size="18" font-weight="400" fill="#182b3c">Each request extends its own state.</text>
  <text x="737" y="960" font-size="18" font-weight="400" fill="#182b3c">On a miss, start from position zero.</text>
</svg>
