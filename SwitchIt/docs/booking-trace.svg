  <text x="1260" y="629" font-size="18" font-weight="400" fill="#3c566a" text-anchor="middle">17:30</text>

  <text x="73" y="702" font-size="16" font-weight="700" fill="#536576" letter-spacing="1.1">BOOKED WINDOW</text>

  <rect x="360" y="676" width="720" height="36" rx="5" fill="#e8f3f6" stroke="#a9cbd5" stroke-width="1.2"/>

  <text x="720" y="700" font-size="17" font-weight="700" fill="#23637e" text-anchor="middle">15:00–17:00 accepted window</text>

  <rect x="1080" y="676" width="102" height="36" rx="5" fill="#fbece7" stroke="#d8b0a6" stroke-width="1.2"/>

  <text x="1131" y="700" font-size="17" font-weight="700" fill="#984939" text-anchor="middle">+17 min</text>

  <text x="73" y="761" font-size="16" font-weight="700" fill="#536576" letter-spacing="1.1">DISPATCH → ETA</text>

  <path d="M366 754L1080 754" fill="none" stroke="#23637e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="1080,754 1069,748.5 1069,759.5" fill="#23637e"/>

  <path d="M1080 754L1182 754" fill="none" stroke="#984939" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/>
  <polygon points="1182,754 1171,748.5 1171,759.5" fill="#984939"/>

  <circle cx="366" cy="754" r="6" fill="#23637e" stroke="#fff" stroke-width="2"/>

  <line x1="1080" y1="669" x2="1080" y2="784" stroke="#984939" stroke-width="2" stroke-dasharray="5 4"/>

  <circle cx="1080" cy="754" r="6" fill="#984939" stroke="#fff" stroke-width="2"/>

  <circle cx="1182" cy="754" r="6" fill="#984939" stroke="#fff" stroke-width="2"/>

  <text x="360" y="799" font-size="18" font-weight="400" fill="#23637e">15:01  Job 4 ends and dispatch begins</text>

  <text x="1064" y="799" font-size="18" font-weight="700" fill="#984939" text-anchor="end">17:00 No-show</text>

  <text x="1064" y="823" font-size="16" font-weight="400" fill="#984939" text-anchor="end">event 49</text>

  <text x="1326" y="799" font-size="18" font-weight="700" fill="#984939" text-anchor="end">17:17 Scheduled arrival</text>

  <text x="1326" y="823" font-size="16" font-weight="400" fill="#984939" text-anchor="end">event 65</text>

  <rect x="48" y="904" width="1304" height="82" rx="12" fill="#faf0dd" stroke="#d9bc86" stroke-width="1.2"/>

  <text x="73" y="936" font-size="16" font-weight="700" fill="#7f521a" letter-spacing="1.1">TO VERIFY A CORRECTION</text>

  <text x="73" y="967" font-size="21" font-weight="400" fill="#182b3c">Rebuild the booking-time state and compare a feasible slot under the same rules.</text>
