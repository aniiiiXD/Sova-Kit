  <text x="73" y="551" font-size="16" font-weight="700" fill="#23637e" letter-spacing="1.1">APPOINTMENT 5  /  ARRIVAL WINDOW</text>

  <text x="73" y="587" font-size="24" font-weight="700" fill="#182b3c">The previous job and travel consumed the booked window</text>

