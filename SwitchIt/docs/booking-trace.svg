<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1032" viewBox="0 0 1400 1032" font-family="Menlo, Consolas, monospace" role="img" aria-labelledby="booking-run-title booking-run-desc">
  <title id="booking-run-title">Follow a booking to its outcome</title>
  <desc id="booking-run-desc">At 12:06 the agent booked appointment 5 for technician 1 in the 15:00 to 17:00 window. The tool returned accepted. SwitchIt matches invocation 9 and call 8, then joins job 5 to appointment 5 in the final database. The previous job ended at 15:01. A no-show was applied at 17:00 and the scheduled arrival was 17:17. The booking decision has enough evidence to investigate, and verifying an alternative requires reconstruction of the decision-time state.</desc>
  <defs>
    <pattern id="booking-run-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#e3e7e6" stroke-width=".75"/>
    </pattern>
  </defs>
  <rect width="1400" height="1032" fill="#f7f7f3"/>
  <rect width="1400" height="1032" fill="url(#booking-run-grid)"/>
  <rect width="1400" height="8" fill="#152d40"/>
  <text x="48" y="49" font-size="16" font-weight="700" fill="#23637e" letter-spacing="1.1">SOVA-KIT  /  SWITCHIT</text>
  <text x="1352" y="49" font-size="16" font-weight="700" fill="#536576" text-anchor="end" letter-spacing="1.1">TRACE AUDIT  ·  CALL 8</text>
  <text x="48" y="108" font-size="43" font-weight="700" fill="#182b3c" letter-spacing="-1.3">Follow a booking to its outcome</text>
  <text x="50" y="147" font-size="21" font-weight="400" fill="#536576">A published TradesBench run · GPT-6.1 Sol · seed 5 · simulator-local times</text>
  <line x1="48" y1="177" x2="1352" y2="177" stroke="#b5c4cb" stroke-width="1"/>
  <rect x="48" y="205" width="604" height="278" rx="12" fill="#e8f3f6" stroke="#a9cbd5" stroke-width="1.2"/>
  <rect x="49" y="218" width="4" height="252" rx="2" fill="#23637e" stroke="none" stroke-width="1.2"/>

  <text x="73" y="242" font-size="16" font-weight="700" fill="#23637e" letter-spacing="1.1">AGENT LOG  /  12:06</text>

  <text x="73" y="278" font-size="26" font-weight="700" fill="#182b3c">The booking action</text>

  <rect x="73" y="300" width="554" height="78" rx="8" fill="#152d40" stroke="none" stroke-width="1.2"/>

  <text x="92" y="329" font-size="19" font-weight="400" fill="#edf6f8">jobs.book(call_id=8, technician_id=1)</text>
  <text x="92" y="357" font-size="19" font-weight="400" fill="#edf6f8">window  15:00–17:00</text>

  <text x="73" y="411" font-size="21" font-weight="700" fill="#1e664f">Receipt      accepted</text>

  <text x="73" y="441" font-size="19" font-weight="400" fill="#182b3c">invocation_id=9  call_id=8</text>

  <text x="73" y="469" font-size="17" font-weight="400" fill="#536576">Route from job 4 checked at 53.3 mi</text>

  <rect x="748" y="205" width="604" height="278" rx="12" fill="#ffffff" stroke="#b5c4cb" stroke-width="1.2"/>
  <rect x="749" y="218" width="4" height="252" rx="2" fill="#23637e" stroke="none" stroke-width="1.2"/>

  <text x="774" y="242" font-size="16" font-weight="700" fill="#23637e" letter-spacing="1.1">FINAL SIMULATOR DATABASE</text>

  <text x="774" y="278" font-size="25" font-weight="700" fill="#182b3c">Join the booked appointment</text>

  <line x1="774" y1="297" x2="1324" y2="297" stroke="#b5c4cb" stroke-width="1"/>

  <text x="774" y="329" font-size="20" font-weight="700" fill="#182b3c">Call 8</text>

  <text x="1016" y="329" font-size="20" font-weight="400" fill="#182b3c">Job 5 → appointment 5</text>

  <line x1="774" y1="347" x2="1324" y2="347" stroke="#b5c4cb" stroke-width="1"/>

  <text x="774" y="379" font-size="20" font-weight="700" fill="#182b3c">Appointment 5</text>

  <text x="1016" y="379" font-size="20" font-weight="700" fill="#984939">status = no_show</text>

  <line x1="774" y1="397" x2="1324" y2="397" stroke="#b5c4cb" stroke-width="1"/>

  <text x="774" y="429" font-size="20" font-weight="700" fill="#182b3c">Job 5</text>

  <text x="1016" y="429" font-size="20" font-weight="400" fill="#984939">no_show_company</text>

  <text x="774" y="469" font-size="17" font-weight="400" fill="#536576">Preserve the source and the matching IDs.</text>

  <path d="M652 394L745 394" fill="none" stroke="#23637e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
