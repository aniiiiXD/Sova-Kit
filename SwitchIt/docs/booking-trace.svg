  <line x1="720" y1="638" x2="720" y2="654" stroke="#b5c4cb" stroke-width="1.4"/>
  <text x="720" y="629" font-size="18" font-weight="400" fill="#3c566a" text-anchor="middle">16:00</text>

  <line x1="1080" y1="638" x2="1080" y2="654" stroke="#b5c4cb" stroke-width="1.4"/>
  <text x="1080" y="629" font-size="18" font-weight="700" fill="#984939" text-anchor="middle">17:00</text>

