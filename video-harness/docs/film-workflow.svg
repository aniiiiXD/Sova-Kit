<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1034" viewBox="0 0 1400 1034" font-family="Menlo, Consolas, monospace" role="img" aria-labelledby="film-timeline-title film-timeline-desc">
  <title id="film-timeline-title">From product captures to an editable film</title>
  <desc id="film-timeline-desc">Authored film.json specifies the scene durations, evidence, assets and brand. Editable Scene.jsx supplies the React scenes and public contains referenced local assets. The generated timeline for the 31-second fictional Relay starter has scene boundaries at 0, 4, 10, 16, 21, 27, and 31 seconds at 30 fps. Preview and MP4 render use the same composition.</desc>
