<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="307" viewBox="0 0 1000 307" role="img" aria-labelledby="title description" font-family="monospace" fill="#233247">
  <title id="title">Video Harness · Make a walkthrough</title>
  <desc id="description">A product brief and capture assets become an editable film.json timeline and React scenes, then a Remotion preview and an H.264 MP4 export.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#e2e7ec" stroke-width=".65"/>
    </pattern>
    <style>
      .title { font-size: 29px; font-weight: 700; letter-spacing: -.8px; }
      .subtitle { font-size: 15px; fill: #4a5a70; }
      .tag, .kicker { font-size: 12px; font-weight: 700; letter-spacing: .8px; }
      .tag { fill: #52647b; }
      .heading { font-size: 19px; font-weight: 700; letter-spacing: -.3px; }
      .body { font-size: 14px; fill: #40516a; }
      .note, .label { font-size: 14px; fill: #475b72; }
      .strip { fill: #f1f4f7; stroke: #c8d3de; }
      .flow { fill: none; stroke: #64758a; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .dash { stroke-dasharray: 4 4; }
    </style>
  </defs>

  <rect width="1000" height="307" fill="#fafafa"/>
  <rect width="1000" height="307" fill="url(#grid)"/>
  <text x="36" y="52" class="title">Video Harness · Make a walkthrough</text>
  <text x="36" y="79" class="subtitle">Build an editable film around a real product workflow</text>
  <text x="964" y="50" class="tag" text-anchor="end">[ FILM WORKFLOW ]</text>
  <path d="M36 96H964" stroke="#c8d3de"/>

  <path d="M250 174H271" class="flow"/>
  <polygon points="262,170 271,174 262,178" fill="#64758a"/>

  <path d="M488 174H509" class="flow"/>
  <polygon points="500,170 509,174 500,178" fill="#64758a"/>

  <path d="M726 174H747" class="flow"/>
  <polygon points="738,170 747,174 738,178" fill="#64758a"/>

  <g>
    <rect x="36" y="118" width="214" height="112" rx="9" fill="#fff6e9" stroke="#dabb92" stroke-width="1.2"/>
    <text x="53" y="143" class="kicker" fill="#855420">SOURCE MATERIAL</text>
    <text x="53" y="168" class="heading">Brief + captures</text>
    <text x="53" y="192" class="body">Product steps, brand,</text>
    <text x="53" y="213" class="body">and reviewed media</text>
  </g>

  <g>
    <rect x="274" y="118" width="214" height="112" rx="9" fill="#f6effa" stroke="#cbb7d9" stroke-width="1.2"/>
    <text x="291" y="143" class="kicker" fill="#64418a">EDITABLE PROJECT</text>
    <text x="291" y="168" class="heading">Compose the film</text>
    <text x="291" y="192" class="body">film.json timeline</text>
    <text x="291" y="213" class="body">and React scenes</text>
  </g>

  <g>
    <rect x="512" y="118" width="214" height="112" rx="9" fill="#edf5fc" stroke="#a3bfd8" stroke-width="1.2"/>
    <text x="529" y="143" class="kicker" fill="#255b88">PREVIEW</text>
    <text x="529" y="168" class="heading">Review the cut</text>
    <text x="529" y="192" class="body">Check pacing and</text>
    <text x="529" y="213" class="body">details in Studio</text>
  </g>

  <g>
    <rect x="750" y="118" width="214" height="112" rx="9" fill="#edf7f0" stroke="#a6c6b0" stroke-width="1.2"/>
    <text x="767" y="143" class="kicker" fill="#236547">EXPORT</text>
    <text x="767" y="168" class="heading">H.264 MP4</text>
    <text x="767" y="192" class="body">Ship the film with</text>
    <text x="767" y="213" class="body">its editable project</text>
  </g>

  <rect x="36" y="248" width="928" height="42" rx="7" class="strip"/>
  <text x="52" y="274" class="note">The same timeline drives the Studio preview and the exported film.</text>
</svg>
